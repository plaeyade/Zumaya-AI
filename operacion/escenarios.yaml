# Modelo operacional — Centro Internacional de Neuro-Oncología Zumaya (Villahermosa, Tabasco)
# Parámetros de producción, distribución, flujo de pacientes y cargas de trabajo.
# Etiquetas: [IBA] dato de la propuesta/SRG de IBA en fuentes/ciclotron_IBA; [BD] base de blindajes
# (blindaje/datos/bd_blindaje_zumaya.json); [LIT] valor típico de literatura; [SUP] supuesto declarado
# a confirmar en la operación real. Horas en formato HH:MM, hora del centro (todas las ciudades
# destino están en el huso horario del centro de México, sin horario de verano).

fisica:
  t12_min: {F18: 109.77, Ga68: 67.71, Cu64: 762.06}   # [LIT] DDEP/NNDC; Cu-64 = 12.701 h
  t12_Ge68_d: 270.95

ciclotron:
  modelo: IBA Cyclone KIUBE 300 (doble haz, 2 x 150 uA)        # [BD] licencia/presupuesto_operativo.json
  corriente_max_total_uA: 300
  corriente_max_blanco_uA: 150
  blancos_F18: 2                                              # [IBA] 2 x Nirta HCFT F18-700
  # Rendimiento de saturación calibrado con la propuesta IBA: "24 Ci de F-18 en 2 h con 180 uA"
  # => Ysat = 888 GBq / (180 uA x (1 - e^{-lambda 120 min})) = 9.29 GBq/uA
  # (equivale a 3.5 GBq/uAh de rendimiento inicial). La cifra teórica de blanco grueso a 18 MeV
  # (5-6 GBq/uAh => Ysat 13-16 GBq/uA) se deja como sensibilidad: la de IBA es la conservadora.
  ysat_F18_GBq_uA: 9.29
  ysat_F18_teorico_GBq_uA: 14.5                               # [LIT] 5.5 GBq/uAh / lambda
  capacidad_blanco_GBq: 700                                   # [IBA] HCFT-700, EOB tras 2 h
  corrientes_blanco_uA: [40, 60, 75, 100, 125, 150]           # escalones de corriente por blanco
  t_irr_min: 20
  t_irr_max: 120                                              # [IBA] SRG: corridas FDG de 2 h
  arranque_min: 45        # [SUP] calentamiento, vacío, RF, llenado de blancos antes del primer haz
  recarga_blanco_min: 15  # [SUP] descarga/rellenado entre irradiaciones
  transferencia_min: 5    # [SUP] EOB -> celda caliente
  presupuesto_uAh_semana: 12000                               # [BD] presupuesto_operativo@1
  horas_haz_dia_diseno_GAMMA: 8                               # [BD] estimacion GAMMA ciclotrón

radiofarmacia:
  modulos_sintesis: 1                     # [IBA] 1 Synthera+ en la propuesta
  limpieza_entre_sintesis_min: 60         # [SUP] decaimiento en celda + cambio de casete
  sintesis_FDG_min: 30                    # [LIT] 25-35 min
  rcy_FDG_corregido: 0.65                 # [LIT] 60-70 %, corregido por decaimiento
  qc_FDG_min: 50                          # [LIT] 45-60 min (liberación paramétrica, esterilidad retrospectiva)
  dispensacion_min: 10                    # dosis local extraída 10 min antes de inyectar
  embalaje_min: 20                        # liberación -> salida del vehículo
  margen_dispensacion: 1.10               # residuos en vial/línea y tolerancia del activímetro [SUP]
  caducidad_FDG_h: 10                     # [SUP] vida útil típica tras EOS (fijar en el registro sanitario)
  limite_bulto_tipo_A_GBq: 600            # A2 del F-18 = 0.6 TBq (OIEA SSR-6) por bulto tipo A
  sensibilidad:                           # caso optimista / nominal / pesimista para la hora de arranque
    optimista: {sintesis_FDG_min: 25, qc_FDG_min: 45, rcy_FDG_corregido: 0.70}
    nominal:   {sintesis_FDG_min: 30, qc_FDG_min: 50, rcy_FDG_corregido: 0.65}
    pesimista: {sintesis_FDG_min: 35, qc_FDG_min: 60, rcy_FDG_corregido: 0.60}

galio68:
  # Opción base: generador Ge-68/Ga-68 (la propuesta IBA trae marcaje de péptidos Ga-68 en Synthera)
  generador_GBq_calibracion: 1.85        # 50 mCi
  edad_generador_d: 90
  eficiencia_elucion: 0.70               # [LIT] cae con la edad (0.8 -> 0.6)
  marcaje_min: 20
  rcy_marcaje: 0.85
  qc_min: 15
  dosis_MBq: 150                         # PSMA/DOTATATE ~2 MBq/kg
  # las eluciones se programan según las citas de Ga-68 (liberación 10 min antes de la cita)
  # Alternativa: blanco líquido 68Zn(NO3)2 en el KIUBE (SRG: bombas de jeringa para 68Ga)
  blanco_liquido: {rendimiento_inicial_GBq_uAh: 0.30, corriente_uA: 40, t_irr_min: 60,
                   purificacion_min: 35, rcy: 0.75}  # [SUP] orden de magnitud de literatura; validar con IBA

cobre64:
  # Blanco sólido 64Ni(p,n)64Cu: OPCIÓN del KIUBE (SRG), no incluida en la 4.a propuesta IBA
  rendimiento_inicial_GBq_uAh: 0.20      # [SUP] ~ 12 MeV en Ni-64 enriquecido tras degradador
  corriente_uA: 30
  t_irr_min: 240
  procesamiento_min: 180                 # disolución, intercambio iónico, evaporación
  qc_min: 60
  rcy: 0.80
  dosis_MBq: 200
  dia_produccion: 1                      # 0 = lunes
  inicio_haz: "13:00"                    # tras las corridas de FDG

distribucion:
  origen: {nombre: Villahermosa, lat: 17.99, lon: -92.93}
  velocidad_kmh: 80                      # [SUP] promedio carretero
  parada_min_cada_4h: 15                 # descanso de chofer
  recepcion_min: 30                      # recepción, ensayo y preparación en destino
  dosis_destino_MBq: 370
  intervalo_dosis_min: 20                # un tomógrafo por destino
  # Distancias carreteras aproximadas desde Villahermosa [SUP]: verificar con la ruta real (SCT / mapas)
  ciudades:
    - {nombre: Coatzacoalcos,     km: 170, lat: 18.13, lon: -94.46, dosis_base: 6, ventana: ["08:00", "15:00"]}
    - {nombre: Ciudad del Carmen, km: 175, lat: 18.65, lon: -91.82, dosis_base: 4, ventana: ["08:00", "15:00"]}
    - {nombre: Tuxtla Gutiérrez,  km: 290, lat: 16.75, lon: -93.12, dosis_base: 8, ventana: ["08:00", "15:00"]}
    - {nombre: Campeche,          km: 375, lat: 19.85, lon: -90.53, dosis_base: 4, ventana: ["08:00", "15:00"]}
    - {nombre: Veracruz,          km: 470, lat: 19.17, lon: -96.13, dosis_base: 8, ventana: ["08:00", "15:00"]}
    - {nombre: Mérida,            km: 555, lat: 20.97, lon: -89.62, dosis_base: 8, ventana: ["08:00", "15:00"]}
    - {nombre: Oaxaca,            km: 700, lat: 17.07, lon: -96.72, dosis_base: 6, ventana: ["08:00", "15:00"]}

