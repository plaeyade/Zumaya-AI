               fraccion_Ga68: 0.15, A0_MBq: 370, jornada: ["07:00", "15:00"]}
    linac:    {fracciones_dia: 30, unidades: 1, turnos: 1, jornada: ["07:00", "15:00"]}
    gk:       {pacientes_dia: 3, flujo: marco, jornada: ["07:00", "17:00"]}
    hdr:      {pacientes_dia: 3, jornada: ["07:00", "15:00"]}
    gammacamara: {pacientes_dia: 15, camaras: 1, jornada: ["07:00", "15:00"]}
    i131:     {pacientes_semana: 1, dias_ingreso: [0], cuartos: 2}
    produccion: {liberaciones: ["07:00", "10:30"], factor_regional: 0.5}
    cu64:     {pacientes_semana: 0}
  E2_medio:
    descripcion: "Medio"
    pet:      {pacientes_dia: 20, escaneres: 1, salas_captacion: 4, vestidores: 2, enfermeria: 1,
               fraccion_Ga68: 0.15, A0_MBq: 370, jornada: ["07:00", "15:00"]}
    linac:    {fracciones_dia: 45, unidades: 1, turnos: 1, jornada: ["07:00", "15:00"]}
    gk:       {pacientes_dia: 5, flujo: marco, jornada: ["07:00", "17:00"]}
    hdr:      {pacientes_dia: 5, jornada: ["07:00", "15:00"]}
    gammacamara: {pacientes_dia: 25, camaras: 1, jornada: ["07:00", "15:00"]}
    i131:     {pacientes_semana: 2, dias_ingreso: [0, 2], cuartos: 2}
    produccion: {liberaciones: ["07:00", "10:30"], factor_regional: 1.0}
    cu64:     {pacientes_semana: 2}
  E3_maximo:
    descripcion: "Máximo"
    pet:      {pacientes_dia: 30, escaneres: 2, salas_captacion: 4, vestidores: 2, enfermeria: 2,
               fraccion_Ga68: 0.15, A0_MBq: 370, jornada: ["07:00", "15:00"]}
    linac:    {fracciones_dia: 60, unidades: 1, turnos: 2, jornada: ["07:00", "23:00"]}
    gk:       {pacientes_dia: 8, flujo: marco, jornada: ["07:00", "17:00"]}
    hdr:      {pacientes_dia: 8, jornada: ["07:00", "15:00"]}
    gammacamara: {pacientes_dia: 35, camaras: 1, jornada: ["07:00", "15:00"]}
    i131:     {pacientes_semana: 3, dias_ingreso: [0, 1, 3], cuartos: 2}
    produccion: {liberaciones: ["07:00", "10:00", "12:30"], factor_regional: 1.5}
    cu64:     {pacientes_semana: 4}

# --------------------------------------------------------------------------- flujo de pacientes
des:
  replicas: 60
  semilla: 20261108
  pet:
    llegada_antelacion_min: 30
    llegada_sd_min: 10
    entrevista_glucemia_min: 10
    vestidor_min: 4
    inyeccion_min: 5
    captacion_min: 60
    miccion_min: 3
    escaneo_min: [20, 25]
    cadencia_slot_min: 25
    recuperacion_min: 15
    acompanantes: 1
    inicio_inyecciones: "07:30"
  linac:
    slot_min: 15                   # IMRT/VMAT
    slot_primera_fx_min: 30        # CBCT + verificación médica
    fracciones_por_curso: 20       # [SUP] mezcla convencional/hipofraccionada
    qa_diaria_min: 30              # TG-142 diario + calentamiento
    qa_semanal_min: 120            # prorrateado entre 5 días
    qa_mensual_min: 360            # prorrateado entre 20 días
    qa_paciente_min: 45            # QA de plan IMRT/VMAT por paciente nuevo (fuera de horario clínico)
    llegada_antelacion_min: 10
    llegada_sd_min: 7
    duracion_relativa: 0.85        # tiempo real / slot
    duracion_cv: 0.20
    inasistencia: 0.03
    p_falla_dia: 0.04
    falla_min: [30, 90]
    acompanantes_p: 0.5
    simulacion_TC_min: 30          # TC simulador por paciente nuevo
  gk:
    marco_min: [15, 25]
    rm_min: [30, 45]
    planeacion_min: [45, 90]
    tratamiento_min: [60, 120]
    retiro_min: 10
    recuperacion_min: 30
    estaciones_planeacion: 2
    llegada: "06:45"
  hdr:
    aplicador_min: [30, 45]
    imagen_TC_min: [15, 20]
    planeacion_min: [30, 45]
    tratamiento_min: [15, 30]      # Co-60 Flexitron, incluye conexión
    retiro_recuperacion_min: [45, 75]
    primera_llegada: "07:30"
    intervalo_min: 60
    camas_recuperacion: 2
  gammacamara:
    protocolos:   # nombre: [fracción, [pasos]]; paso = [tipo, minutos] con tipo iny|espera|camara|esfuerzo
      oseo:        [0.40, [[iny, 5], [espera, 180], [camara, 25]]]
      perfusion:   [0.20, [[iny, 5], [espera, 45], [camara, 20], [esfuerzo, 20], [espera, 30], [camara, 20]]]
      renal:       [0.10, [[camara, 35]]]
      tiroides:    [0.15, [[iny, 5], [espera, 20], [camara, 15]]]
      otros:       [0.15, [[iny, 5], [espera, 60], [camara, 30]]]
    primera_llegada: "07:15"
    acompanantes: 1
  i131:
    estancia_noches: [2, 3]        # liberación por tasa de dosis; [BD] diseño: 3 días
    descontaminacion_d: 1
    semanas: 52

# --------------------------------------------------------------------------- personal (referencia OIEA, orientativa)
personal:
  # IAEA Human Health Reports No. 13 (2015) "Staffing in radiotherapy: an activity based approach";
  # IAEA "Nuclear Medicine Resources Manual" (2020); IAEA Radioisotopes and Radiopharmaceuticals
  # Series No. 3 "Cyclotron produced radionuclides: guidance on facility design and production of FDG" (2012).
  rtt_por_unidad_turno: 2
  fisico_rt_por_unidad: 1
  fisico_rt_por_pacientes_nuevos_anio: 450
  dosimetrista_por_pacientes_nuevos_anio: 300
  oncologo_por_pacientes_nuevos_anio: 250
  ingeniero_por_unidades_mv: 2
  tecnologo_pet_por_escaner_turno: 2
  enfermeria_pet_por_salas_captacion: 4
  medico_nuclear_por_estudios_dia: 25
  tecnologo_gc_por_camara_turno: 1.5
  fisico_mn_por_equipos: 4           # PET + gammacámaras + activímetros
  radiofarmacia_por_turno: {operador_ciclotron: 1, radioquimico: 1, analista_cc: 1}
  radiofarmacia_fijo: {responsable_sanitario: 1, ingeniero_ciclotron: 1, logistica_choferes_por_ruta: 1}
  gk_por_unidad: {fisico: 1, neurocirujano: 1, enfermeria: 1, tecnologo: 1}
  hdr_por_unidad: {fisico: 1, oncologo: 1, enfermeria: 1, anestesiologo: 1, rtt: 1}
  dias_laborales_anio: 250

# --------------------------------------------------------------------------- supuestos de diseño del blindaje
diseno_blindaje:
  linac:  {W_Gy_sem: 900, base: "30 pac/jornada x 2 turnos x 5 d x 3 Gy (GAMMA 28-10-26; F87/F88)",
           dosis_fx_Gy: 2.0, factor_IMRT: 3.0, fraccion_IMRT: 1.0, TVL_fuga_hormigon_cm: 33}
  pet:    {pacientes_sem: 60, A0_MBq: 740, salas_captacion: 4, escaneres: 1, t_captacion_h: 1.0, t_escaneo_h: 0.5,
           base: "TG-108: 60 pac/sem, 20 mCi (GAMMA 28-10-26)"}
  i131:   {pacientes_sem: 2, A_GBq: 7.4, noches: 3, base: "2 pac/sem x 3 días, 200 mCi"}
  hdr:    {pacientes_sem: 50, Gy_paciente: 7, base: "40-50 pac/sem, 7 Gy, 25 min"}
  gk:     {pacientes_sem: 20, base: "20 pac/sem, 6600 Ci + 10 %"}
  gammacamara: {pacientes_sem: 43, base: "40 Tc-99m + 2 I-131 + 1 Lu-177 por semana"}
  tc_simulador: {pacientes_sem: 125, base: "[EST] F88: 25 pac/día x 5"}
  dias_semana: 5
  tg108: {gamma_uSv_m2_MBq_h: 0.092, factor_vaciado: 0.85}   # 0.143 x 0.64 (autoatenuación del paciente)
